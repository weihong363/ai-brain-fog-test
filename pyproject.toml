[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-brain-fog-test"
version = "0.1.0"
description = "Deterministic scoring engine for an AI cognitive calibration personality test"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [{name = "weihong363"}]
keywords = ["ai", "skill", "assessment", "cognitive-calibration"]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
ai-brain-fog = "ai_brain_fog.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.data-files]
"rules" = ["rules/scoring.json"]
"share/ai-brain-fog-test" = ["data/personas.json", "data/questions.json"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
